[project]
name = "ufmg-mcp"
version = "0.1.0"
description = "Servidor MCP para o Moodle Minhas Turmas da UFMG"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "tzdata>=2024.1",
]

[project.scripts]
ufmg-mcp = "ufmg_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ufmg_mcp"]
